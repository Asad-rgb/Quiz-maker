<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Application</title>
  <!-- Load Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }
    .hidden { display: none !important; }
    video { width: 100%; border-radius: 8px; margin-bottom: 15px; }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
      width: 100%;
    }
    button:hover { background-color: #0056b3; }
    .option-btn {
      background-color: #e9ecef;
      color: #333;
      margin: 8px 0;
      text-align: left;
    }
    .option-btn:hover { background-color: #d3d9df; }
    .option-btn.selected {
      background-color: #28a745;
      color: white;
    }
    #question-text { font-size: 18px; font-weight: bold; margin-bottom: 20px; }
    .status { margin-top: 15px; font-size: 14px; color: #666; }
    .score-text { font-size: 24px; font-weight: bold; color: #28a745; margin: 15px 0; }
  </style>
</head>
<body>

  <!-- Screen 1: Permissions & Capture -->
  <div id="init-screen" class="card">
    <h2>Welcome to the Quiz</h2>
    <p>Please allow camera and location access to begin.</p>
    <video id="camera-feed" autoplay playsinline class="hidden"></video>
    <canvas id="photo-canvas" class="hidden"></canvas>
    <button id="start-btn">Grant Access & Start</button>
    <p id="init-status" class="status">Waiting for permissions...</p>
  </div>

  <!-- Screen 2: Quiz -->
  <div id="quiz-screen" class="card hidden">
    <div style="display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 15px; color: #666;">
      <span id="question-tracker">Question 1/10</span>
    </div>
    <div id="question-text">Question goes here?</div>
    <div id="options-container"></div>
    <button id="next-btn" class="hidden">Next Question</button>
  </div>

  <!-- Screen 3: Completion -->
  <div id="result-screen" class="card hidden">
    <h2>Quiz Complete!</h2>
    <div id="score-display" class="score-text"></div>
    <p>Your answers, photo, and location have been securely saved.</p>
    <p id="final-status" class="status"></p>
  </div>

  <script>
    // Initialize Supabase
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 10 Demo Questions
    const quizData = [
      { question: "Which phenomenon is responsible for the human eye perceiving the colorful world?", options: ["Reflection", "Dispersion of light", "Total Internal Reflection", "Interference"], correct: 1 },
      { question: "The SI unit of electric current is:", options: ["Volt", "Ohm", "Ampere", "Watt"], correct: 2 },
      { question: "According to modern atomic models, where is the mass of an atom primarily concentrated?", options: ["In the electron cloud", "In the nucleus", "Equally distributed", "In empty space"], correct: 1 },
      { question: "Which of the following mirrors is used by a dentist to examine a small cavity?", options: ["Convex mirror", "Plane mirror", "Concave mirror", "Any spherical mirror"], correct: 2 },
      { question: "Which part of the plant is responsible for the transport of water?", options: ["Phloem", "Xylem", "Stomata", "Chloroplast"], correct: 1 },
      { question: "Which soil type is most widely spread and important in India?", options: ["Alluvial soil", "Black soil", "Red soil", "Laterite soil"], correct: 0 },
      { question: "In economics, banking and communication fall under which sector?", options: ["Primary sector", "Secondary sector", "Tertiary sector", "Quaternary sector"], correct: 2 },
      { question: "Which gas is released during photosynthesis?", options: ["Carbon dioxide", "Oxygen", "Nitrogen", "Methane"], correct: 1 },
      { question: "An alloy of copper and zinc is known as:", options: ["Bronze", "Brass", "Solder", "Steel"], correct: 1 },
      { question: "The focal length of a plane mirror is:", options: ["Zero", "Infinity", "25 cm", "-25 cm"], correct: 1 }
    ];

    let currentQuestionIndex = 0;
    let userAnswers = [];
    let capturedPhotoBase64 = "";
    let capturedLocation = { lat: null, lng: null };
    let selectedOptionIndex = null;

    // DOM Elements
    const initScreen = document.getElementById('init-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const startBtn = document.getElementById('start-btn');
    const initStatus = document.getElementById('init-status');
    const cameraFeed = document.getElementById('camera-feed');
    const photoCanvas = document.getElementById('photo-canvas');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const nextBtn = document.getElementById('next-btn');
    const questionTracker = document.getElementById('question-tracker');
    const scoreDisplay = document.getElementById('score-display');

    // Function to request permissions automatically or on click
    async function requestAccessAndStart() {
      startBtn.disabled = true;
      initStatus.innerText = "Requesting permissions...";

      try {
        // 1. Get Location
        const position = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true });
        });
        capturedLocation.lat = position.coords.latitude;
        capturedLocation.lng = position.coords.longitude;

        // 2. Get Camera
        initStatus.innerText = "Accessing camera...";
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        cameraFeed.srcObject = stream;
        cameraFeed.classList.remove('hidden');
        
        await new Promise(resolve => cameraFeed.onloadedmetadata = resolve);
        
        // Capture Photo
        const context = photoCanvas.getContext('2d');
        photoCanvas.width = 320;
        photoCanvas.height = 240;
        context.drawImage(cameraFeed, 0, 0, photoCanvas.width, photoCanvas.height);
        capturedPhotoBase64 = photoCanvas.toDataURL('image/jpeg', 0.8);
        
        // Stop Camera
        stream.getTracks().forEach(track => track.stop());

        // 3. Start Quiz
        initScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        loadQuestion();

      } catch (err) {
        console.error(err);
        initStatus.innerText = "Error: Please allow Camera and Location access. Refresh or click the button to try again.";
        initStatus.style.color = "red";
        startBtn.disabled = false;
      }
    }

    // Auto-trigger permissions on page load
    window.addEventListener('load', () => {
      requestAccessAndStart();
    });

    // Fallback button if auto-trigger fails (browser block)
    startBtn.addEventListener('click', () => {
      requestAccessAndStart();
    });

    // Load Question Logic
    function loadQuestion() {
      selectedOptionIndex = null;
      nextBtn.classList.add('hidden');
      
      const q = quizData[currentQuestionIndex];
      questionTracker.innerText = `Question ${currentQuestionIndex + 1}/10`;
      questionText.innerText = q.question;
      
      optionsContainer.innerHTML = '';
      
      q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.innerText = opt;
        btn.className = 'option-btn';
        btn.onclick = () => selectOption(index, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(index, btn) {
      selectedOptionIndex = index;
      
      const allBtns = optionsContainer.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      
      nextBtn.classList.remove('hidden');
      if(currentQuestionIndex === quizData.length - 1) {
        nextBtn.innerText = "Submit Quiz";
      }
    }

    // Handle Progression and Submission
    nextBtn.addEventListener('click', async () => {
      const isCorrectAnswer = selectedOptionIndex === quizData[currentQuestionIndex].correct;
      userAnswers.push({
        question: quizData[currentQuestionIndex].question,
        selectedAnswer: quizData[currentQuestionIndex].options[selectedOptionIndex],
        isCorrect: isCorrectAnswer
      });

      currentQuestionIndex++;

      if (currentQuestionIndex < quizData.length) {
        loadQuestion();
      } else {
        // Calculate Score
        const correctCount = userAnswers.filter(ans => ans.isCorrect).length;
        scoreDisplay.innerText = `Your Score: ${correctCount} / ${quizData.length}`;

        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        document.getElementById('final-status').innerText = "Saving to database...";
        
        // Save to Supabase
        const { data, error } = await supabase
          .from('quiz_submissions')
          .insert([
            { 
              latitude: capturedLocation.lat, 
              longitude: capturedLocation.lng, 
              photo_base64: capturedPhotoBase64, 
              answers: userAnswers 
            }
          ]);

        if (error) {
          console.error(error);
          document.getElementById('final-status').innerText = "Database Error: " + error.message;
          document.getElementById('final-status').style.color = "red";
        } else {
          document.getElementById('final-status').innerText = "Successfully saved to Supabase!";
          document.getElementById('final-status').style.color = "green";
        }
      }
    });
  </script>
</body>
</html>
